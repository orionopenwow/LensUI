# Lens robustness and fluidity (docs/TESTING.md)
#  * robustness   — every PR: perf budgets, reduced-motion check, visual regression, accessibility,
#                   theme switching (tools/robust/theme-switch.mjs), a short soak + chaos pass.
#                   Headless Chromium on the real frontend, Tauri mocked.
#  * windows-e2e  — every PR: builds the real app and drives its WebView2 windows on Windows over
#                   CDP, then checks Windows was put back the way it was (tools/e2e/probe.ps1), then
#                   proves "Remove all Lens changes" leaves nothing behind (tests/e2e/remove-all.mjs).
#  * nightly      — the long versions: full soak, longer Playground runs, a 10× start/quit loop and
#                   property tests with many more cases.
# Rust property tests (src-tauri/src/tests/robustness) also run in build.yml's `cargo test --lib`.
name: robustness

on:
  pull_request:
    paths-ignore:
      - "docs/site/**"
      - "docs/media/**"
      - "docs/brand/**"
      - "docs/brain/**"
      - "tools/site/**"
      - "tools/media/**"
      - "README.md"
      - "*.bat"
  # Pushes to main only: a branch with a pull request is tested once, through the pull request
  # (running both doubled the queue on the shared Windows runners).
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/site/**"
      - "docs/media/**"
      - "docs/brand/**"
      - "docs/brain/**"
      - "tools/site/**"
      - "tools/media/**"
      - "README.md"
      - "*.bat"
  schedule:
    - cron: "17 9 * * *" # nightly, 02:17 Phoenix
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Upload fresh perf numbers and goldens as artifacts (never commits)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The crash-loop guard asks its question in a message box; an unattended run answers "start
  # normally" (docs/FAILSAFE.md §6). tests/e2e/failsafe.mjs sets its own answer per start.
  LENS_SAFE_MODE_CHOICE: normal
  # Goldens and budgets are recorded with this exact Chromium; bump them together.
  PLAYWRIGHT_VERSION: "1.63.0"

jobs:
  robustness:
    name: Fluidity, visuals, a11y, soak (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install test tools (not in the lockfile)
        run: |
          npm install --no-save --no-package-lock playwright@${PLAYWRIGHT_VERSION} axe-core@4
          npx playwright install --with-deps chromium

      - name: Build harness
        run: node tools/robust/build.mjs

      - name: Perf budgets (4× CPU throttle)
        run: node tools/perf/run.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.update_baselines) && '--update' || '' }}

      - name: Reduced motion means no motion
        if: always()
        run: node tools/perf/reduced-motion.mjs

      - name: Window buttons blend into every title bar (caption parity)
        if: always()
        # Lens's real overlay code (src-tauri/src/caption_paint.rs) over every theme pack, Windows'
        # own light/dark/accent/Mica title bars, active and inactive, normal and maximised, all three
        # button orders and 100–250 % scaling. Fails if any pixel outside the buttons differs from
        # the title bar. rustc is on the runner image; no crates are needed.
        env:
          CAPTION_SHOTS: "0"
        run: node tools/parity/caption/run.mjs

      - name: Visual regression
        if: always()
        # Fails on any changed image; missing goldens are recorded to the visual-new artifact.
        env:
          VISUAL_REQUIRE_GOLDENS: ${{ hashFiles('tools/parity/golden/*.png') != '' && '1' || '0' }}
          # Artifacts aren't reachable from every review environment; the log always is.
          VISUAL_EMIT_B64: "1"
        run: node tools/visual/run.mjs

      - name: Accessibility (axe-core)
        if: always()
        run: node tools/a11y/run.mjs

      - name: Theme switching (no flash, no layout jump, quick, Settings still works)
        if: always()
        # Every featured look on the Appearance page, Simple mode, and switches made by another
        # window; the nightly run goes through every pack (tools/robust/theme-switch.mjs).
        run: node tools/robust/theme-switch.mjs ${{ github.event_name == 'schedule' && '--full' || '' }}

      # Hyper suite (tools/hyper/run.mjs, docs/TESTING.md): every Settings switch and choice, every
      # surface, and the cross-cutting rules, with a coverage report of every inventoried feature.
      # Fails only on failures not listed in tools/hyper/known.json; nightly runs the full tier.
      - name: Hyper suite (every control, every surface, the rules)
        run: node tools/hyper/run.mjs ${{ github.event_name == 'schedule' && '--full' || '' }}

      - name: Soak + chaos (short)
        if: always() && github.event_name != 'schedule'
        env:
          SOAK_SCALE: "0.3"
        run: node tools/soak/run.mjs

      - name: Soak + chaos (full)
        if: always() && github.event_name == 'schedule'
        run: node tools/soak/run.mjs

      - name: Longer Playground runs (nightly)
        if: always() && github.event_name == 'schedule'
        env:
          PERF_SCENE_MS: "15000"
          PERF_ONLY: playground-sand,playground-fluid,playground-flow,playground-constellation,playground-aurora,playground-rain,playground-starfield,playground-skyclock
        run: node tools/perf/run.mjs

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robustness-reports
          path: |
            tools/perf/out/
            tools/perf/budgets.json
            tools/soak/out/
            tools/a11y/out/
            tools/robust/out/theme-rig/
            tools/hyper/out/
            tools/visual/out/report.json
            tools/visual/out/diff/
          if-no-files-found: warn

      - name: Upload new goldens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-new
          path: tools/visual/out/new/
          if-no-files-found: ignore

      - name: Upload current renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-actual
          path: tools/visual/out/actual/
          if-no-files-found: ignore

  windows-e2e:
    name: End-to-end on Windows (real app over CDP)
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: e2e

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # A debug build of the real app with the frontend embedded (custom protocol, no dev server),
      # plus a config overlay that opens a DevTools port on every webview (tests/e2e/tauri-config.mjs).
      - name: Build Lens (debug, no installer, DevTools port)
        run: |
          node tests/e2e/tauri-config.mjs
          bun run tauri build --debug --no-bundle --config tests/e2e/out/tauri.e2e.json

      - name: Install Playwright (attaches over CDP; no browser download)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm install --no-save --no-package-lock playwright@${{ env.PLAYWRIGHT_VERSION }}

      - name: Snapshot Windows state
        shell: pwsh
        run: pwsh tools/e2e/probe.ps1 snapshot tests/e2e/out/before.json

      - name: End-to-end scenarios
        shell: pwsh
        env:
          E2E_RESTARTS: ${{ github.event_name == 'schedule' && '10' || '0' }}
        run: node tests/e2e/run.mjs

      - name: Windows put back after quit
        if: always() && hashFiles('tests/e2e/out/before.json') != ''
        shell: pwsh
        run: pwsh tools/e2e/probe.ps1 compare tests/e2e/out/before.json

      # Remove-all proof: snapshots every HKCU key and file in the change registry
      # (src-tauri/src/changes.rs), turns features on through the real app, runs "Remove all Lens
      # changes" and diffs against the snapshot. Any leftover fails the job.
      - name: Remove all Lens changes leaves nothing behind
        if: always() && hashFiles('src-tauri/target/debug/lens-ui.exe') != ''
        shell: pwsh
        run: node tests/e2e/remove-all.mjs

      # Failsafe chaos (docs/FAILSAFE.md §8): damaged and unreadable config, a kill switch, a crash
      # loop into Safe Mode, a window made to crash, every WebView renderer killed, a registry key
      # that refuses writes. Lens must keep the desktop usable through each one.
      - name: Failsafe chaos (the desktop stays usable)
        if: always() && hashFiles('src-tauri/target/debug/lens-ui.exe') != ''
        shell: pwsh
        run: node tests/e2e/failsafe.mjs

      # Auto-hide on a real desktop (tests/e2e/autohide.mjs): moves the real cursor through the Top
      # Bar and Dock edges, opens and dismisses flyouts every way, and checks the real window state
      # after each step: no stuck-open bar, no flicker, no flyout left behind.
      - name: Auto-hide (Top Bar and Dock, real cursor)
        if: always() && hashFiles('src-tauri/target/debug/lens-ui.exe') != ''
        shell: pwsh
        run: node tests/e2e/autohide.mjs

      # Command intents (tests/e2e/intents.mjs): every action the offline engine knows previews
      # from its own phrasing; dark ↔ light mode is run and put back.
      - name: Command intents (preview every action)
        if: always() && hashFiles('src-tauri/target/debug/lens-ui.exe') != ''
        shell: pwsh
        run: node tests/e2e/intents.mjs

      - name: Collect Lens logs
        if: always()
        shell: pwsh
        run: |
          $d = Join-Path $env:APPDATA "LensUI"
          if (Test-Path $d) {
            New-Item -ItemType Directory -Force -Path tests/e2e/out/appdata | Out-Null
            Get-ChildItem $d -Recurse -Include *.log, *.txt, *.json -ErrorAction SilentlyContinue |
              Where-Object { $_.Length -lt 2MB -and $_.FullName -notmatch "secret|clip|shelf" } |
              Copy-Item -Destination tests/e2e/out/appdata -Force
          }

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-windows
          path: tests/e2e/out/
          if-no-files-found: warn

  nightly-properties:
    name: Property tests, many cases (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Placeholders for the Windows-only build inputs
        run: |
          mkdir -p dist && echo '<!doctype html><title>Lens</title>' > dist/index.html
          test -f src-tauri/lens_dwm_hook.dll || touch src-tauri/lens_dwm_hook.dll

      - name: cargo test robustness (4096 cases each)
        working-directory: src-tauri
        env:
          PROPTEST_CASES: "4096"
        run: cargo test --lib robustness_tests -- --test-threads 4
