name: Project brain

# Keeps docs/brain/generated/* (IPC command inventory, windows and routes, size by area, bug-pattern
# counts, open PRs) in step with the code. Weekly and on demand: regenerates with
# tools/brain/refresh.mjs and, when anything drifted, opens or updates one PR from brain/refresh.
# The hand-written brain docs (docs/brain/*.md) are not touched; the PR body reminds a human to
# review them against the diff.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: brain-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate brain inventories
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/brain/refresh.mjs

      - name: Open or update the refresh PR when the brain drifted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs/brain/generated; then
            echo "Brain is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C brain/refresh
          git add docs/brain/generated
          git commit -m "Refresh project brain inventories" -m "Generated by .github/workflows/brain.yml (tools/brain/refresh.mjs)."
          git push --force-with-lease origin brain/refresh
          {
            echo "Weekly refresh of \`docs/brain/generated/*\` by \`tools/brain/refresh.mjs\`."
            echo
            echo "Review the diff, then update the hand-written brain docs if it shows new commands, windows,"
            echo "features in PR, or rising bug-pattern counts (\`docs/brain/FEATURES.md\`, \`SCOPE.md\`, \`BUGS.md\`)."
            echo
            echo '```'
            git diff --stat origin/${{ github.event.repository.default_branch }} -- docs/brain/generated
            echo '```'
          } > /tmp/brain-pr.md
          existing=$(gh pr list --head brain/refresh --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file /tmp/brain-pr.md
          else
            gh pr create --base "${{ github.event.repository.default_branch }}" --head brain/refresh \
              --title "Refresh project brain inventories" --body-file /tmp/brain-pr.md
          fi
