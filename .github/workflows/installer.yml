# Installer smoke test: builds the real NSIS and MSI installers and runs what a first-time user
# does on a clean Windows runner (tools/installer/smoke.ps1): silent install, first launch,
# install over a running Lens, uninstall with Lens running, and the MSI. Windows' state is
# snapshotted before and compared after (tools/e2e/probe.ps1). Screenshots and logs are uploaded.
#
# Runs on pull requests that touch the installer, on version tags, weekly, and by hand.
name: installer

on:
  pull_request:
    paths:
      - "src-tauri/windows/**"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/src/win_uninstall.rs"
      - "src-tauri/src/changes.rs"
      - "tools/installer/**"
      - "tools/build/**"
      - ".github/workflows/installer.yml"
      - ".github/workflows/release.yml"
  push:
    tags: ["v*"]
  schedule:
    - cron: "41 10 * * 1" # Mondays, 03:41 Phoenix
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    name: Install, launch, upgrade, uninstall (clean Windows)
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: installer

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Thin LTO: this job tests the installer, not the optimiser; the release workflow ships fat LTO.
      - name: Build NSIS + MSI installers
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: bun run tauri build --bundles nsis,msi

      - name: Smoke test
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          Get-Item $setup, $msi | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
          pwsh tools/installer/smoke.ps1 -Setup $setup.FullName -Msi $msi.FullName -Out installer-out

      - name: Upload screenshots, logs and installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-smoke
          path: |
            installer-out/
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
