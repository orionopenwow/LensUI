# Lens CI
#  * windows  — the real build: frontend type-check + bundle, Rust check / clippy / unit tests,
#               hook DLL rebuilt from source, and a full installer build on version tags.
#  * contract — generated IPC types are in sync with the Rust commands; frontend unit tests.
#  * parity   — renders every surface in a headless browser with mocked Tauri APIs and fails on any
#               crash, console error or empty surface; screenshots are uploaded as an artifact.
name: build

on:
  # Pushes to main and tags only: branches are tested once, through their pull request.
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/site/**"
      - "docs/media/**"
      - "docs/brand/**"
      - "docs/brain/**"
      - "tools/site/**"
      - "tools/media/**"
      - "README.md"
      - "*.bat"
    tags: ["v*"]
  pull_request:
    paths-ignore:
      - "docs/site/**"
      - "docs/media/**"
      - "docs/brand/**"
      - "docs/brain/**"
      - "tools/site/**"
      - "tools/media/**"
      - "README.md"
      - "*.bat"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/lens-dwm-hook

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # tsc + vite build. Also produces dist/, which tauri::generate_context! embeds at compile time.
      - name: Type-check and bundle frontend
        run: bun run build

      # Lens Mission Control is dev-only (docs/MISSION_CONTROL.md): no build config may enable the
      # `admin` feature, and the bundle just built must not contain its code.
      - name: Mission Control stays out of release builds
        run: node tools/mission/guard.mjs dist

      # Never ship the committed binary: rebuild the injected hook DLL from its source and embed that.
      - name: Rebuild lens_dwm_hook.dll from source
        shell: pwsh
        run: |
          cargo build --release --manifest-path src-tauri/lens-dwm-hook/Cargo.toml
          Copy-Item src-tauri/lens-dwm-hook/target/release/lens_dwm_hook.dll src-tauri/lens_dwm_hook.dll -Force

      # --locked: Cargo.lock must match Cargo.toml, so a fresh clone builds exactly what CI built.
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked --all-targets

      # -D warnings: every rustc warning (dead code, unused imports, ...) fails the build. The
      # remaining allow-list covers clippy's style-level groups only; shrink it over time.
      # correctness / suspicious lints always fail the build.
      - name: cargo clippy
        working-directory: src-tauri
        run: >
          cargo clippy --locked --all-targets --
          -D warnings
          -D clippy::correctness
          -D clippy::suspicious
          -A clippy::style
          -A clippy::complexity
          -A clippy::perf
          -A clippy::too_many_arguments
          -A clippy::missing_safety_doc

      - name: cargo test (pure-logic unit tests)
        working-directory: src-tauri
        run: cargo test --locked --lib

      # The dev-only Mission Control module (`--features admin`): lint it and run its tests. Never
      # used for the installer below.
      - name: cargo clippy + test (Mission Control, admin feature)
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets --features admin -- -D warnings -D clippy::correctness -D clippy::suspicious -A clippy::style -A clippy::complexity -A clippy::perf -A clippy::too_many_arguments -A clippy::missing_safety_doc
          cargo test --lib --features admin mission::

      - name: Build installer (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: bun run tauri build

      - name: Upload installer (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: lens-ui-installer
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error

  contract:
    name: IPC types + frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # src/types/generated.ts is produced from the #[tauri::command] signatures. A stale file
      # means the frontend and backend disagree about a payload, so fail instead of shipping it.
      - name: Generated IPC types are up to date
        run: python3 tools/gen-types/gen_types.py --check

      # Every registry, settings and hook writer has an undo in src-tauri/src/changes.rs.
      - name: Change registry covers every OS writer
        run: node tools/changes/check.mjs

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # bun's built-in runner (bun:test): no extra devDependency, so the lockfile is unchanged.
      - name: Frontend unit tests
        run: bun run test

      # docs/SMOOTHNESS.md: animations that tear (layout properties, timers standing in for an
      # animation's end, native window resizes from a page). Counts per file may only go down.
      - name: Motion lint (ratchet)
        run: node tools/polish/motion-lint.mjs

  parity:
    name: Visual parity (headless render)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright + Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium

      - name: Build harness
        run: node tools/parity/build.mjs

      - name: Render every surface
        run: node tools/parity/shoot.mjs

      - name: Render every Lens setup page (first launch and What's new, dark and light)
        run: node tools/parity/setup/shoot.mjs

      - name: Render the Magic scaffold previews (flags off and on, dark and light)
        run: node tools/parity/magicwaves/shoot.mjs

      - name: Render Lens Command scenes
        run: node tools/parity/command/build.mjs && node tools/parity/command/shoot.mjs
      - name: Approval card gallery (Needs your OK)
        run: node tools/parity/approval/build.mjs && node tools/parity/approval/shoot.mjs

      - name: Render Lens Browser scenes and smoke-test the page agent
        run: node tools/parity/browser/build.mjs && node tools/parity/browser/shoot.mjs

      - name: Render Lens Snip scenes
        run: node tools/parity/snip/build.mjs && node tools/parity/snip/shoot.mjs

      - name: Render AI surfaces
        run: node tools/parity/ai/build.mjs && node tools/parity/ai/shoot.mjs

      - name: Render productivity cards
        run: node tools/parity/productivity/shoot.mjs

      - name: Render Tester Hub
        run: node tools/parity/tester/build.mjs && node tools/parity/tester/shoot.mjs
      - name: Render Guide scenes
        run: node tools/parity/guide/build.mjs && node tools/parity/guide/shoot.mjs
      - name: Magic right-click window gallery
        run: node tools/parity/magic/build.mjs && node tools/parity/magic/shoot.mjs
      - name: Lens at work gallery (overlay, banner, in-app twin, demo reel)
        run: node tools/parity/presence/build.mjs && node tools/parity/presence/shoot.mjs

      - name: Render agent safety + hostile-page collector check
        run: node tools/parity/agentsafe/build.mjs && node tools/parity/agentsafe/shoot.mjs

      - name: Render Expressive and Dot Matrix style layers
        run: node tools/parity/styles/build.mjs && node tools/parity/styles/shoot.mjs

      - name: Render Lens Music
        run: node tools/parity/music/build.mjs && node tools/parity/music/shoot.mjs

      - name: Render Lens Apps
        run: node tools/parity/apps/build.mjs && node tools/parity/apps/shoot.mjs

      - name: Render Lens Cleaner
        run: node tools/parity/cleaner/build.mjs && node tools/parity/cleaner/shoot.mjs

      - name: Backdrop Lab (shader compile, NaN, loop seams, switch flash, screenshots)
        run: node tools/parity/backdrop/build.mjs && node tools/parity/backdrop/shoot.mjs

      - name: Render ambient backdrops (contact sheets + in-browser timing)
        run: node tools/parity/ambient/build.mjs && node tools/parity/ambient/shoot.mjs
        env:
          AMBIENT_LOOPS: "0"
          AMBIENT_DESKTOPS: "0"
          # Software rendering on shared CI runners is slower than a real desktop; the strict 3 ms
          # gate is the bun test on the pure painters.
          AMBIENT_BUDGET_MS: "8"

      - name: Render Lens Mission Control (dev-only admin window, every page on sample data)
        run: node tools/robust/build.mjs && node tools/parity/mission/shoot.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-screenshots
          path: |
            tools/parity/mission/shots/
            tools/parity/shots/
            tools/parity/setup/shots/
            tools/parity/command/shots/
            tools/parity/browser/shots/
            tools/parity/snip/shots/
            tools/parity/ai/shots/
            tools/parity/productivity/
            tools/parity/tester/shots/
            tools/parity/guide/shots/
            tools/parity/presence/shots/*.png
            tools/parity/presence/shots/*.webp
            tools/parity/approval/shots/
            tools/parity/magic/shots/
            tools/parity/agentsafe/shots/
            tools/parity/styles/shots/
            tools/parity/music/shots/
            tools/parity/apps/shots/
            tools/parity/backdrop/shots/
            tools/parity/ambient/shots/
          if-no-files-found: warn
