[package]
name = "lens-ui"
version = "0.4.0"
description = "Lens — a calm, themeable desktop shell for Windows 10 and 11"
authors = ["Lens"]
edition = "2021"

[lib]
name = "lens_ui_lib"
# rlib only. Tauri's template also lists staticlib and cdylib, which only mobile builds use: on
# Windows each one made the release build link and LTO-optimise all of Lens again, tripling the
# long, quiet "lens-ui (530/532)" step and its memory use.
crate-type = ["rlib"]

[features]
# Lens Mission Control (docs/MISSION_CONTROL.md): the maintainer's dev-only admin window.
# Only Launch-Lens-UI.bat's dev build enables it (`tauri dev --features admin`). Never a default,
# never in a release: src/mission/mod.rs refuses to compile it without debug assertions, and
# tools/mission/guard.mjs fails CI if a build or release config turns it on.
admin = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset", "unstable"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.17"
sysinfo = "0.33"
# Lens Intelligence: HTTPS to Claude and loopback HTTP to local models (blocking client, rustls/ring).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
# The WebView2 COM types behind Tauri's webviews (same versions Tauri links, nothing new is
# downloaded): app::renderer listens for a renderer that exits; Lens Browser handles site
# permission requests.
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.58", features = [
    "ApplicationModel",
    "ApplicationModel_DataTransfer",
    "Devices_Radios",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Media_Control",
    "Security_Credentials_UI",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_ColorSystem",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# Unwind, so a panic inside an OS callback can be caught at its guard and the event passed on
# (docs/FAILSAFE.md §3). A panic outside a guard still ends the process: the panic hook restores
# the taskbar and aborts.
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Property-based tests (src/tests/robustness, docs/TESTING.md). Not linked into the app.
[dev-dependencies]
proptest = "1"
