<!-- Lens example plugin: Clock. Self-contained: no network, no permissions. -->
<style>
  body { display: flex; align-items: center; justify-content: center; height: 100vh; }
  #t { white-space: nowrap; font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
  #s { color: var(--lens-fg-muted); font-weight: 500; }
</style>
<span id="t"></span>
<script>
  const el = document.getElementById("t");
  // Seconds sit right after the minutes, before any AM/PM marker, in the muted colour.
  const fmt = new Intl.DateTimeFormat([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
  function draw() {
    el.textContent = "";
    for (const part of fmt.formatToParts(new Date())) {
      if (part.type === "second") {
        const sec = document.createElement("span");
        sec.id = "s";
        sec.textContent = part.value;
        el.append(sec);
      } else {
        el.append(part.value);
      }
    }
  }
  draw();
  lens.on("tick", draw);
</script>
