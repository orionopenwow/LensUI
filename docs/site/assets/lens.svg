<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="outerRing" x1="36" y1="36" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="48%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="innerLens" x1="78" y1="78" x2="184" y2="184" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#fafafa" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#18181b" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="2" y="2" width="252" height="252" rx="54" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <!-- Outer precision optical bezel -->
  <circle cx="128" cy="128" r="78" stroke="url(#outerRing)" stroke-width="14"/>
  <!-- Offset inner interlocking aperture ring -->
  <circle cx="132" cy="124" r="46" stroke="url(#innerLens)" stroke-width="9"/>
  <!-- Optical glint -->
  <circle cx="106" cy="100" r="8" fill="#fafafa" fill-opacity="0.92"/>
  <circle cx="106" cy="100" r="14" fill="#38bdf8" fill-opacity="0.18"/>
  <!-- Precision center core -->
  <circle cx="128" cy="128" r="16" fill="#09090b" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
</svg>
